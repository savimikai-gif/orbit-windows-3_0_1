name: Build ORBIT 3.2.1 for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Native/**'
      - 'Web/**'
      - 'Assets/**'
      - 'Installer/**'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check Web/src/main.js
          node --check Web/src/native-bridge.js
          node --check Web/src/commands.js
          node tests/commands.test.mjs
      - name: Publish self-contained ORBIT.exe
        shell: pwsh
        run: |
          dotnet publish Native/ORBIT.csproj -c Release -r win-x64 --self-contained true -o Publish -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          if (!(Test-Path 'Publish/ORBIT.exe')) { throw 'ORBIT.exe was not created.' }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $possible = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          $compiler = $possible | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$compiler) { throw 'Inno Setup compiler not found.' }
          & $compiler Installer/ORBIT.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
      - name: Create checksum for updater
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'Release/ORBIT_3_2_1_Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path 'Release/ORBIT_3_2_1_Setup.exe.sha256' -Value "$hash  ORBIT_3_2_1_Setup.exe" -NoNewline
      - uses: actions/upload-artifact@v6
        with:
          name: ORBIT-3.2.1-Windows
          path: |
            Publish/ORBIT.exe
            Release/ORBIT_3_2_1_Setup.exe
            Release/ORBIT_3_2_1_Setup.exe.sha256
          if-no-files-found: error

